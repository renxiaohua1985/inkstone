name = "inkstone"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "0409ade5-a426-4948-9517-9c5773e9515c"

[[kv_namespaces]]
binding = "FILES_KV"
id = "7823feddb3794996b4b7e6f03cec138b"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "d4e8bff5c1ed4e58b9f57060509c3a71"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"

[observability]
enabled = true
