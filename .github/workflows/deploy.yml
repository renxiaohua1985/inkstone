name: Deploy Inkstone to Cloudflare

on:
  push:
    branches:
      - main  # 如果你的默认分支叫 master，请修改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      # 1. 检出 GitHub 仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. 安装项目依赖
      - name: Install Dependencies
        run: npm ci

      # 4. 一键完成打包并部署至 KV 模式
      # 系统会自动读取 env 内的凭证，通过 package.json 内部最纯正的管线发起发布
      - name: Run Build and Deploy Script
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:kv
