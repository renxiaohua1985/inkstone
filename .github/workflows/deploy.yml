name: Deploy Inkstone to Cloudflare

on:
  push:
    branches:
      - main  # 如果你的默认分支叫 master，请修改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      # 1. 检出 GitHub 仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境（Inkstone 推荐使用 Node 20 或更高版本）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # 开启 npm 缓存加速后续构建

      # 3. 安装项目依赖
      - name: Install Dependencies
        run: npm ci

      # 4. 执行前端和 Worker 的全量编译
      - name: Build Application
        run: npm run build

      # 5. 使用 Wrangler Action 执行部署与数据库迁移
      # 默认运行 npm run deploy (R2 模式)。
      # 如果你需要切换为 KV 模式，请将下方的 command 改为: run deploy:kv
      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: run deploy:kv
