name: Deploy Inkstone to Cloudflare KV

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Install Dependencies
        # 安装项目依赖，并强制绕过同级依赖冲突
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Workers
        # 1. 必须升级到 v4 版本，v3 会强行降级 Node 环境
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 2. 调用 Inkstone 自己的打包 KV 部署脚本
          command: run deploy:kv 
