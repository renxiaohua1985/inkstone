name: Deploy Inkstone to Cloudflare KV

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 1. 显式设定固定大版本号
          node-version: '22.x' 
          # 2. 关键核心：强制忽略项目内任何可能存在的锁版本文件（如 .nvmrc）
          check-latest: true 

      - name: Verify Node Version
        # 验证步骤：确保打印出来的版本号确实是 v22.x
        run: node -v 

      - name: Install Dependencies
        # 3. 双重保险：在安装项目依赖时也强制绕过同级依赖冲突
        run: npm install --legacy-peer-deps 

      - name: Build Project
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: run deploy:kv
